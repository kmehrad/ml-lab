[project]
name = "smartphone-addiction"
version = "0.1.0"
description = "Kaggle Playground S6E8 — Predicting Smartphone Addiction"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "catboost>=1.2.8", "jupyter>=1.1", "kaggle>=1.7", "lightgbm>=4.6",
  "matplotlib>=3.9", "nbformat>=5.10", "numpy>=2.0", "optuna>=4.2",
  "pandas>=2.2", "pyarrow>=17", "pytest>=8.3", "scikit-learn>=1.5",
  "scipy>=1.14", "seaborn>=0.13", "xgboost>=2.1",
]

[project.optional-dependencies]
gpu = ["torch>=2.5", "pytorch-tabular>=1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
