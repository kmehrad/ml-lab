[project]
name = "electricvehiclepurchases"
version = "0.1.0"
description = "Kaggle Playground S6E9 EV purchase probability prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.10",
    "jupyter>=1.1.1",
    "kaggle>=1.6.17",
    "lightgbm>=4.6.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pytest>=8.3.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "xgboost>=2.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
